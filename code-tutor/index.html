<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: rgba(24, 26, 32, 0.92);
    --bg-light: rgba(38, 41, 50, 0.95);
    --accent: #4f8cff;
    --text: #e8eaf0;
    --text-dim: #9aa0ae;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  /* 消息区允许拖选复制：* 通配符不继承，必须对后代元素显式放开 */
  #messages, #messages * { user-select: text; }
  #messages .copybtn { user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", system-ui, sans-serif; }
  /* 无框窗缩放热区：body 四周 4px 交给系统 resize，内部元素不覆盖到最外圈 */
  body { -webkit-app-region: no-drag; }
  #panel { -webkit-app-region: no-drag; }

  /* ---------- 展开面板 ---------- */
  #panel {
    width: 100%; height: 100%;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    overflow: hidden;
    clip-path: inset(0 round var(--radius));
    -webkit-app-region: no-drag;
  }
  #titlebar {
    height: 40px; flex: none;
    background: var(--bg-light);
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    /* 系统级拖动：OS 负责移动窗口，与边缘缩放热区互不干扰 */
    -webkit-app-region: drag;
    cursor: grab;
  }
  #titlebar:active { cursor: grabbing; }
  /* 标题栏内的按钮必须排除在拖动区外，否则点不动 */
  #titlebar .dot, #titlebar .wb { -webkit-app-region: no-drag; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.t { background: #ff5f57; cursor: pointer; }
  .dot.b { background: #febc2e; cursor: pointer; }
  #title { flex: 1; color: var(--text-dim); font-size: 12px; margin-left: 4px; }

  /* ---------- 窗口功能条 ---------- */
  #winbtns { display: flex; gap: 2px; }
  .wb {
    width: 30px; height: 26px;
    background: transparent; border: none;
    color: var(--text-dim); font-size: 13px;
    cursor: pointer; border-radius: 6px;
    line-height: 1; padding: 0;
  }
  .wb:hover { background: rgba(255,255,255,0.12); color: var(--text); }
  .wb-close:hover { background: #e81123; color: #fff; }

  #messages { flex: 1; overflow-y: auto; padding: 12px; user-select: text; cursor: text; }
  .msgwrap { position: relative; margin-bottom: 12px; }
  .msgwrap.user { display: flex; justify-content: flex-end; }
  .msgwrap.user .copybtn { display: none; }
  .copybtn {
    position: absolute; top: -8px; right: 4px;
    padding: 1px 8px; font-size: 11px;
    background: var(--bg-light); color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px; cursor: pointer; z-index: 2;
  }
  .copybtn:hover { color: var(--text); background: rgba(255,255,255,0.12); }

  /* ---------- 历史查看层（记忆库） ---------- */
  #historyLayer {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.55);
    display: none; padding: 14px;
  }
  #historyLayer.open { display: block; }
  #historyPanel {
    width: 100%; height: 100%;
    background: var(--bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
  }
  #historyHead {
    flex: none; height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; background: var(--bg-light); color: var(--text); font-size: 12.5px;
  }
  #histFiles {
    flex: none; display: flex; gap: 6px; padding: 8px 10px;
    overflow-x: auto; background: rgba(0,0,0,0.25);
  }
  .histFile {
    flex: none; padding: 3px 10px; font-size: 11.5px;
    background: var(--bg-light); color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; cursor: pointer;
  }
  .histFile.active { color: #fff; border-color: var(--accent); background: rgba(79,140,255,0.2); }
  #histBody {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    font-size: 12.5px; line-height: 1.6; color: var(--text);
    user-select: text;
  }
  #histBody h3 { margin: 10px 0 4px; font-size: 13px; color: #9fc2ff; }
  #histBody hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 8px 0; }
  #histBody blockquote {
    margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--accent);
    background: rgba(79,140,255,0.08); color: var(--text); white-space: pre-wrap;
  }
  #histBody code {
    background: rgba(0,0,0,0.4); color: #cde3ff;
    padding: 1px 5px; border-radius: 4px;
    font-family: Consolas, monospace; font-size: 11.5px; }
  #histBody strong { color: #fff; }

  /* ---------- 硬件档案设置层 ---------- */
  #hwLayer {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0,0,0,0.55);
    display: none; padding: 14px;
  }
  #hwLayer.open { display: block; }
  #hwPanel {
    width: 100%; height: 100%;
    background: var(--bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
  }
  #hwHead {
    flex: none; height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; background: var(--bg-light); color: var(--text); font-size: 12.5px;
  }
  #hwForm { flex: 1; overflow-y: auto; padding: 10px 12px; }
  #hwForm label { display: block; font-size: 12px; color: var(--text-dim); margin: 8px 0; }
  #hwForm input, #hwForm select, #hwForm textarea {
    display: block; width: 100%; margin-top: 3px;
    padding: 6px 8px; background: rgba(0,0,0,0.3); color: var(--text);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;
    font-size: 12.5px; font-family: inherit; outline: none; user-select: text;
  }
  #hwForm input:focus, #hwForm select:focus, #hwForm textarea:focus { border-color: var(--accent); }
  .hwperi {
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 8px; margin: 6px 0; background: rgba(255,255,255,0.03);
  }
  .hwperi .row { display: flex; gap: 6px; margin-bottom: 5px; }
  .hwperi .row input { margin-top: 0; flex: 1; }
  .hwperi .row input.small { flex: 0 0 70px; }
  .hwperi .del { cursor: pointer; color: #ff7a7a; font-size: 11px; background: none; border: none; padding: 2px; }
  #hwFoot { flex: none; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
  #hwFoot .optbtn { width: 100%; background: var(--accent); color: #fff; border: none; }

  /* ---------- 选项按钮（A/B/C 决策） ---------- */
  .optrow { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .optbtn {
    text-align: left; padding: 7px 10px;
    background: var(--bg-light); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; cursor: pointer; font-size: 12.5px;
    user-select: none;
  }
  .optbtn:hover { border-color: var(--accent); background: rgba(79,140,255,0.15); }
  .optbtn.optdone { opacity: 0.4; cursor: default; }
  .optbtn.optdone:hover { border-color: rgba(255,255,255,0.12); background: var(--bg-light); }
  /* 自定义选项输入行 */
  .optcustom { display: flex; gap: 6px; align-items: center; }
  .optcustom-input {
    flex: 1; padding: 6px 10px;
    background: rgba(0,0,0,0.3); color: var(--text);
    border: 1px dashed rgba(255,255,255,0.25);
    border-radius: 8px; font-size: 12.5px; font-family: inherit;
    outline: none; user-select: text;
  }
  .optcustom-input:focus { border-color: var(--accent); border-style: solid; }
  .optcustom-input::placeholder { color: var(--text-dim); }

  /* ---------- HTML 图示渲染 ---------- */
  .htmlfig { position: relative; margin: 8px 0 14px; }
  .htmlframe {
    width: 100%; min-height: 80px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; background: #fff;
    display: block;
  }
  .figbtns { display: flex; gap: 6px; margin-top: 4px; }
  .figbtns .copybtn { position: static; }
  .srcview {
    margin: 6px 0 0; padding: 8px;
    background: rgba(0,0,0,0.35); color: #cde3ff;
    border-radius: 8px; font-size: 11px; font-family: Consolas, monospace;
    max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    user-select: text;
  }
  .msg { max-width: 88%; margin-bottom: 10px; padding: 8px 10px;
    border-radius: 10px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.md { white-space: normal; }
  /* ---------- Markdown 渲染样式 ---------- */
  .msg.md h1, .msg.md h2, .msg.md h3, .msg.md h4 {
    margin: 8px 0 4px; line-height: 1.35; color: var(--text); }
  .msg.md h1 { font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 3px; }
  .msg.md h2 { font-size: 14px; }
  .msg.md h3 { font-size: 13.5px; }
  .msg.md h4 { font-size: 13px; }
  .msg.md p { margin: 4px 0; }
  .msg.md ul, .msg.md ol { margin: 4px 0; padding-left: 20px; }
  .msg.md li { margin: 2px 0; }
  .msg.md code {
    background: rgba(0,0,0,0.4); color: #cde3ff;
    padding: 1px 5px; border-radius: 4px;
    font-family: Consolas, monospace; font-size: 12px; }
  .msg.md pre {
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 8px; overflow-x: auto; margin: 6px 0; }
  .msg.md pre code { background: transparent; padding: 0; color: #cde3ff; font-size: 11.5px; }
  .msg.md blockquote {
    margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--accent);
    background: rgba(79,140,255,0.08); color: var(--text-dim); }
  .msg.md table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
  .msg.md th, .msg.md td { border: 1px solid rgba(255,255,255,0.18); padding: 3px 8px; }
  .msg.md th { background: rgba(255,255,255,0.06); }
  .msg.md strong { color: #fff; }
  .msg.md a { color: #7fb0ff; }
  .msg.md hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 8px 0; }
  .msg.user { background: var(--accent); color: #fff; margin-left: auto; }
  .msg.ai { background: var(--bg-light); color: var(--text); }

  #inputbar { flex: none; padding: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
  #inputbar textarea {
    width: 100%; height: 52px; resize: none;
    background: var(--bg-light); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 8px; font-size: 13px; outline: none; user-select: text;
  }
  #btnrow { display: flex; gap: 8px; margin-top: 8px; }
  #btnrow button {
    flex: 1; padding: 8px 0; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
  }
  #btnrow button.secondary { background: var(--bg-light); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12); }
  #btnrow button:hover { filter: brightness(1.15); }

  /* ---------- 小球 ---------- */
  #ball {
    display: none;
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6ea8ff, #2b6be0);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    cursor: pointer;
    align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: bold;
    border: 2px solid rgba(255,255,255,0.35);
  }
  body.mode-ball #panel { display: none; }
  body.mode-ball #ball { display: flex; }
</style>
</head>
<body>
  <div id="panel">
    <div id="titlebar">
      <div class="dot t" id="btnHide" title="隐藏到托盘"></div>
      <div class="dot b" id="btnBall" title="收起成小球"></div>
      <div id="title">Code Tutor · <span id="taskName">…</span></div>
      <!-- 右侧功能条：最小化 / 收起小球 / 关闭 -->
      <div id="winbtns">
        <button class="wb" id="wbHw" title="硬件档案：填写你的芯片/外设/引脚，AI 回答将与硬件一致">&#x2699;</button>
        <button class="wb" id="wbNew" title="多开：新建一个任务窗口">&#xFF0B;</button>
        <button class="wb" id="wbMin" title="最小化（隐藏到托盘）">&#x2500;</button>
        <button class="wb" id="wbBall" title="收起成小球">&#x26EC;</button>
        <button class="wb wb-close" id="wbClose" title="关闭（退出程序）">&#x2715;</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="inputbar">
      <textarea id="input" placeholder="告诉助教：我要写什么文件…（如：IIC 定义文件）"></textarea>
      <div id="btnrow">
        <button id="btnSend">发送</button>
        <button id="btnCheck" class="secondary">检验代码</button>
        <button id="btnCode" class="secondary">给我代码</button>
        <button id="btnHistory" class="secondary" title="查看之前保存到记忆库的对话">历史</button>
      </div>
    </div>
  </div>
  <div id="hwLayer">
    <div id="hwPanel">
      <div id="hwHead">
        <span>⚙ 硬件档案 <span style="font-size:11px;color:var(--text-dim)">（本任务：任务-<span id="hwTask"></span>）</span></span>
        <div style="display:flex; gap:6px;">
          <button id="hwImport" class="copybtn" style="position:static" title="从 JSON 文件内容导入">导入</button>
          <button id="hwExport" class="copybtn" style="position:static" title="复制 JSON，可分享给别人或放进预设库">导出</button>
          <button id="hwClose" class="copybtn" style="position:static">关闭</button>
        </div>
      </div>
      <div id="hwForm">
        <label>MCU 型号 *<input id="hwMcu" placeholder="如 STM32F103C8T6"></label>
        <label>库类型
          <select id="hwLib">
            <option value="">（未选）</option>
            <option>标准外设库</option>
            <option>HAL</option>
            <option>LL</option>
            <option>寄存器直接操作</option>
            <option>Arduino / 其他</option>
          </select>
        </label>
        <label>板卡（可选）<input id="hwBoard" placeholder="如 Blue Pill / Nucleo-F103 / 自制板"></label>
        <label>时钟（可选）<input id="hwClock" placeholder="如 HSE 8MHz × 9 = 72MHz"></label>
        <div id="hwPeriList"></div>
        <button id="hwAddPeri" class="copybtn" style="position:static" title="添加一个外设">＋ 添加外设</button>
        <label>其他补充<textarea id="hwNotes" rows="2" placeholder="调试器、供电方式、特殊注意事项…"></textarea></label>
        <div id="hwMsg" style="display:none; font-size:11.5px; margin:4px 0;"></div>
      </div>
      <div id="hwFoot">
        <button id="hwSaveBtn" class="optbtn" style="text-align:center">保存（保存后每次问话自动带上这些硬件事实）</button>
      </div>
    </div>
  </div>
  <div id="historyLayer">
    <div id="historyPanel">
      <div id="historyHead">
        <span>记忆库 · 对话记录</span>
        <div style="display:flex; gap:6px; align-items:center;">
          <button id="histResume" class="copybtn" style="position:static; color:#9fc2ff; border-color:#4f8cff;" title="把这一天（或最新一天）的对话载入当前会话，接着聊">从此继续</button>
          <button id="histClose" class="copybtn" style="position:static">关闭</button>
        </div>
      </div>
      <div id="histFiles"></div>
      <div id="histTasks" style="flex:none; display:flex; gap:6px; align-items:center; padding:6px 10px; background:rgba(0,0,0,0.18); border-bottom:1px solid rgba(255,255,255,0.08); overflow-x:auto;">
        <span style="flex:none; font-size:11px; color:var(--text-dim);">任务:</span>
      </div>
      <div id="histResumeBar" style="display:none; flex:none; padding:6px 10px; background:rgba(79,140,255,0.12); color:var(--text); font-size:12px; border-bottom:1px solid rgba(255,255,255,0.1);">
        载入到哪一轮？
        <div id="histResumeList" style="margin-top:6px; max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
      </div>
      <div id="histBody" class="md"></div>
    </div>
  </div>
  <div id="ball" title="点击展开">AI</div>

<script>
  const $ = id => document.getElementById(id);
  const messages = $('messages');

  // 解析 [OPTIONS] 块：返回 { body, options: [{key, label}] }
  function parseOptions(text) {
    const m = text.match(/\n?\[OPTIONS\]\s*\n((?:[A-D]=.+\n?)+)\s*$/);
    if (!m) return { body: text, options: null };
    const options = m[1].trim().split('\n').map((line) => {
      const i = line.indexOf('=');
      return i > 0 ? { key: line.slice(0, i).trim(), label: line.slice(i + 1).trim() } : null;
    }).filter(Boolean);
    if (options.length === 0) return { body: text, options: null };
    return { body: text.slice(0, m.index).trimEnd(), options };
  }

  // 拆分 ```html 代码块：返回 [{type:'text',text}|{type:'html',code}]
  function parseHtmlBlocks(text) {
    const parts = [];
    const re = /```html\s*\n([\s\S]*?)```/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push({ type: 'text', text: text.slice(last, m.index) });
      parts.push({ type: 'html', code: m[1] });
      last = re.lastIndex;
    }
    if (last < text.length) parts.push({ type: 'text', text: text.slice(last) });
    return parts;
  }

  // 让一组选项按钮失效（已选过）
  function disableOptions(wrap) {
    wrap.querySelectorAll('.optbtn').forEach((b) => { b.disabled = true; b.classList.add('optdone'); });
  }

  // 轻量 Markdown → HTML（先整体转义再解析，无注入风险）
  function renderMd(src) {
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // 1. 抽出代码块（```lang ... ```），占位防被行内规则破坏
    const blocks = [];
    src = src.replace(/```(\w*)\s*\n([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000B' + (blocks.length - 1) + '\u0000';
    });
    // 2. 逐行解析：标题 / 分隔线 / 列表 / 引用 / 表格 / 段落
    const lines = esc(src).split('\n');
    const out = [];
    let list = null;        // 'ul' | 'ol' | 'quote' | null
    let table = null;       // 收集表格行
    const closeList = () => {
      if (!list) return;
      out.push(list === 'quote' ? '</blockquote>' : '</' + list + '>');
      list = null;
    };
    const flushTable = () => {
      if (!table) return;
      const rows = table.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
      let html = '<table>';
      rows.forEach((r, i) => {
        const cells = r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
        html += '<tr>' + cells.map((c) => (i === 0 ? '<th>' + inline(c) + '</th>' : '<td>' + inline(c) + '</td>')).join('') + '</tr>';
      });
      out.push(html + '</table>');
      table = null;
    };
    // 3. 行内：加粗 / 斜体 / 行内代码 / 链接
    const inline = (s) => s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    for (const raw of lines) {
      const line = raw.trimEnd();
      const hm = line.match(/^(#{1,4})\s+(.*)/);
      const tm = line.match(/^\s*\|.*\|\s*$/);
      if (tm) { closeList(); if (!table) table = []; table.push(line); continue; }
      if (table) flushTable();
      if (hm) { closeList(); out.push('<h' + hm[1].length + '>' + inline(hm[2]) + '</h' + hm[1].length + '>'); continue; }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { closeList(); out.push('<hr>'); continue; }
      const qm = line.match(/^\s*&gt;\s?(.*)/);
      if (qm) {
        if (list !== 'quote') { closeList(); out.push('<blockquote>'); list = 'quote'; }
        out.push('<p>' + inline(qm[1]) + '</p>'); continue;
      }
      const um = line.match(/^\s*[-*+]\s+(.*)/);
      const om = line.match(/^\s*\d+[.、]\s+(.*)/);
      if (um || om) {
        const want = um ? 'ul' : 'ol';
        if (list !== want) { closeList(); out.push('<' + want + '>'); list = want; }
        out.push('<li>' + inline((um || om)[1]) + '</li>'); continue;
      }
      if (line.trim() === '') { closeList(); continue; }
      closeList();
      out.push('<p>' + inline(line) + '</p>');
    }
    if (table) flushTable();
    closeList();
    // 4. 回填代码块
    return out.join('\n').replace(/\u0000B(\d+)\u0000/g, (_, i) => blocks[+i]);

  function makeDraggable(el) {

    el.addEventListener('mousedown', e => {

      window.ct.drag(dx, dy);
      lx = e.screenX; ly = e.screenY;

  /** 把记忆库 md 解析回轮次数组（### HH:MM · 我/Code Tutor 分节） */
  function parseMemMd(md) {
    const rounds = [];
    const re = /^### (\d{2}:\d{2}) · (我|Code Tutor)\s*$/gm;
    let m, positions = [];
    while ((m = re.exec(md)) !== null) positions.push({ at: m.index, time: m[1], who: m[2] === '我' ? 'user' : 'ai' });
    for (let i = 0; i < positions.length; i++) {
      const start = md.indexOf('\n', positions[i].at) + 1;
      const end = i + 1 < positions.length ? positions[i + 1].at : md.length;
      // 去掉引用前缀（ai 消息存储时逐行加了引用；LLM 输出里可能有嵌套引用，循环剥到没有为止）
      const text = md.slice(start, end).trim().split('\n')
        .map((l) => {
          let out = l;
          while (out === '>' || out.startsWith('&gt; ') || out.startsWith('> ')) {
            out = out === '>' ? '' : out.replace(/^&gt; /, '').replace(/^> /, '');
          }
          return out;
        })
        .join('\n').replace(/\n{3,}/g, '\n\n').trim();
      if (text) rounds.push({ time: positions[i].time, who: positions[i].who, text });
    }
    return rounds;
  }

      + '<input class="p-protocol small" placeholder="协议" value="' + (p.protocol || '') + '">'
      + '<input class="p-address small" placeholder="地址" value="' + (p.address || '') + '">'
      + '<input class="p-pins" placeholder="引脚，如 PB8=SCL,PB9=SDA" value="' + (p.pins || '').replace(/"/g, '&quot;') + '">'
      + '</div>';
    div.querySelector('.del').onclick = () => div.remove();
    return div;
  }

  async function hwOpen() {
    hwLayer.classList.add('open');
    const hw = await window.ct.hwGet();
    $('hwMcu').value = hw.mcu || '';
    $('hwLib').value = hw.library || '';
    $('hwBoard').value = hw.board || '';
    $('hwClock').value = hw.clock || '';
    $('hwNotes').value = hw.notes || '';
    const list = $('hwPeriList');
    list.innerHTML = '';
    for (const p of (hw.peripherals || [])) list.appendChild(periRow(p));
    $('hwMsg').style.display = 'none';
  }
  $('wbHw').onclick = hwOpen;
  $('hwClose').onclick = () => hwLayer.classList.remove('open');
  hwLayer.addEventListener('click', (e) => { if (e.target === hwLayer) hwLayer.classList.remove('open'); });
  $('hwAddPeri').onclick = () => $('hwPeriList').appendChild(periRow());

  $('hwSaveBtn').onclick = async () => {
    const profile = {
      mcu: $('hwMcu').value.trim(),
      library: $('hwLib').value,
      board: $('hwBoard').value.trim(),
      clock: $('hwClock').value.trim(),
      notes: $('hwNotes').value.trim(),
      peripherals: [...$('hwPeriList').querySelectorAll('.hwperi')].map((d) => ({
        name: d.querySelector('.p-name').value.trim(),
        protocol: d.querySelector('.p-protocol').value.trim(),
        address: d.querySelector('.p-address').value.trim(),
        pins: d.querySelector('.p-pins').value.trim(),
      })).filter((p) => p.name),
    };
    const msg = $('hwMsg');
    try {
      await window.ct.hwSave(profile);
      msg.textContent = '✅ 已保存。之后的每次提问都会自动带上这些硬件事实。';
      msg.style.color = '#7fe08f';
    } catch (e) {
      msg.textContent = '保存失败：' + e.message;
      msg.style.color = '#ff7a7a';
    }
    msg.style.display = 'block';
    setTimeout(() => { msg.style.display = 'none'; }, 4000);
  };

  $('hwExport').onclick = async () => {
    // 导出 = 读取当前表单组合成 JSON 复制到剪贴板（不强制先保存）
    const profile = {
      mcu: $('hwMcu').value.trim(), library: $('hwLib').value,
      board: $('hwBoard').value.trim(), clock: $('hwClock').value.trim(),
      notes: $('hwNotes').value.trim(),
      peripherals: [...$('hwPeriList').querySelectorAll('.hwperi')].map((d) => ({
        name: d.querySelector('.p-name').value.trim(),
        protocol: d.querySelector('.p-protocol').value.trim(),
        address: d.querySelector('.p-address').value.trim(),
        pins: d.querySelector('.p-pins').value.trim(),
      })).filter((p) => p.name),
    };
    navigator.clipboard.writeText(JSON.stringify(profile, null, 2)).then(() => {
      $('hwExport').textContent = '已复制 JSON';
      setTimeout(() => { $('hwExport').textContent = '导出'; }, 1500);
    });
  };

  $('hwImport').onclick = () => {
    // 导入 = 弹出 textarea 让用户粘贴 JSON（浏览器文件选择需额外权限，粘贴最通用）
    const bar = $('hwMsg');
    const ta = document.createElement('textarea');
    ta.rows = 5; ta.style.cssText = 'width:100%;margin-top:6px;background:rgba(0,0,0,0.3);color:var(--text);border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-size:11.5px;user-select:text;';
    ta.placeholder = '粘贴硬件档案 JSON（可从别人的"导出"获得，或自己写）';
    const apply = document.createElement('button');
    apply.className = 'copybtn'; apply.style.position = 'static'; apply.style.marginTop = '4px';
    apply.textContent = '✓ 应用';
    apply.onclick = () => {
      try {
        const j = JSON.parse(ta.value);
        $('hwMcu').value = j.mcu || '';
        $('hwLib').value = j.library || '';
        $('hwBoard').value = j.board || '';
        $('hwClock').value = j.clock || '';
        $('hwNotes').value = j.notes || '';
        const list = $('hwPeriList');
        list.innerHTML = '';
        for (const p of (j.peripherals || [])) list.appendChild(periRow(p));
        ta.remove(); apply.remove();
        bar.textContent = '已应用粘贴的档案，检查无误后点保存。';
        bar.style.color = '#7fe08f'; bar.style.display = 'block';
      } catch (e) {
        bar.textContent = 'JSON 解析失败：' + e.message;
        bar.style.color = '#ff7a7a'; bar.style.display = 'block';
      }
    };
    $('hwForm').insertBefore(apply, $('hwPeriList'));
    $('hwForm').insertBefore(ta, apply);
  };

  // ---------- 跨任务跳转的预载上下文 ----------
  // 启动时取一次；若窗口已在运行（跳转聚焦场景），再短暂轮询几次兜底
  let resumeApplied = false;
  async function tryApplyResume() {
    if (resumeApplied) return true;
    const resume = await window.ct.resumeTake();
    if (!resume || !Array.isArray(resume.rounds) || resume.rounds.length === 0) return false;
    resumeApplied = true;
    history.length = 0;
    for (const r of resume.rounds) history.push({ text: r.text, who: r.who });
    messages.innerHTML = '';
    addMsg('—— 从「' + (window.ct.task || 'default') + '」记忆库跳转载入 ' + resume.rounds.length + ' 轮对话，接着聊 ——', 'ai', null, { skipSave: true });
    for (const r of resume.rounds) addMsg(r.text, r.who);
    messages.scrollTop = messages.scrollHeight;
    return true;
  }
  tryApplyResume().then((ok) => { if (!ok) { let n = 0; const t = setInterval(async () => { if (await tryApplyResume() || ++n >= 10) clearInterval(t); }, 2000); } });
</script>
</body>
</html>
